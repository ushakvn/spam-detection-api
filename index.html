<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #ff9966, #ff5e62);
        }

        .card {
            width: 300px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-top: 10px;
            border: 4px solid #ff5e62;
        }

        .card h2 {
            font-size: 22px;
            color: #333;
            margin: 10px 0;
        }

        .card p {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icons a {
            text-decoration: none;
            color: white;
            background: #ff5e62;
            padding: 10px;
            border-radius: 50%;
            font-size: 18px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: #ff9966;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.pravatar.cc/150?img=3" alt="Profile Picture">
        <h2>John Doe</h2>
        <p>Web Developer | UI Designer</p>
        <div class="social-icons">
            <a href="#">🔵</a>
            <a href="#">🔴</a>
            <a href="#">🟣</a>
        </div>
    </div>

</body>
</html>
